<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="330" rx="14" fill="#f6f8fa"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">切回家里 Wi-Fi → 页面自动打开设备</text>

  <!-- 步骤1：设备重启 -->
  <g>
    <rect x="30" y="80" width="210" height="170" rx="12" fill="#fff" stroke="#d0d7de"/>
    <circle cx="135" cy="135" r="28" fill="#fffbe9" stroke="#9a6700"/>
    <path d="M135 122 v16 l10 8" fill="none" stroke="#9a6700" stroke-width="3" stroke-linecap="round"/>
    <text x="135" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">① 设备重启联网</text>
    <text x="135" y="212" text-anchor="middle" font-size="12" fill="#57606a">保存后自动重启</text>
    <text x="135" y="230" text-anchor="middle" font-size="12" fill="#57606a">约需 5~10 秒</text>
  </g>

  <!-- 步骤2：手机切网 -->
  <g>
    <rect x="275" y="80" width="210" height="170" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="380" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">② 手机切回家里 Wi-Fi</text>
    <rect x="297" y="120" width="166" height="40" rx="8" fill="#f0f6ff" stroke="#0969da"/>
    <text x="380" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">我家路由器名</text>
    <text x="380" y="156" text-anchor="middle" font-size="11" fill="#57606a">✓ 已连接</text>
    <text x="380" y="190" text-anchor="middle" font-size="12" fill="#57606a">从设备热点切回家庭 Wi-Fi</text>
    <text x="380" y="208" text-anchor="middle" font-size="12" fill="#57606a">（此时设备热点已关闭）</text>
    <text x="380" y="232" text-anchor="middle" font-size="12" fill="#8c959f">配网页会提示你执行这一步</text>
  </g>

  <!-- 步骤3：自动打开 -->
  <g>
    <rect x="520" y="80" width="210" height="170" rx="12" fill="#e6f4ea" stroke="#1a7f37"/>
    <text x="625" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">③ 自动打开设备页</text>
    <rect x="542" y="122" width="166" height="44" rx="8" fill="#fff" stroke="#1a7f37"/>
    <text x="625" y="140" text-anchor="middle" font-size="12" fill="#0969da">espswitch-1A2B.local</text>
    <text x="625" y="158" text-anchor="middle" font-size="11" fill="#57606a">智能开关控制页</text>
    <text x="625" y="196" text-anchor="middle" font-size="12" fill="#1a7f37">网络恢复后自动跳转</text>
    <text x="625" y="216" text-anchor="middle" font-size="12" fill="#57606a">未跳转就手动输地址</text>
  </g>

  <!-- 箭头 -->
  <path d="M245 165 H268" stroke="#6e7781" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M490 165 H513" stroke="#6e7781" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#8c959f">提示：如果页面没有自动打开，等十几秒后手动输入 espswitch-XXXX.local，或用路由器里查到的 IP 访问</text>
  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#8c959f">（Windows 电脑可能无法解析 .local 地址，请用 IP）</text>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6e7781"/></marker></defs>
</svg>
