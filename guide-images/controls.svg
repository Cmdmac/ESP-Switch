<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="340" rx="14" fill="#f6f8fa"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">设备控制页（浏览器打开设备地址即可）</text>

  <!-- 控制页卡片 -->
  <rect x="40" y="70" width="680" height="230" rx="14" fill="#fff" stroke="#d0d7de"/>

  <!-- 开关卡 -->
  <g>
    <rect x="60" y="92" width="200" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="160" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">开关</text>
    <rect x="120" y="130" width="52" height="28" rx="14" fill="#0969da"/>
    <circle cx="140" cy="144" r="11" fill="#fff"/>
    <text x="160" y="166" text-anchor="middle" font-size="11" fill="#57606a">开 / 关</text>
  </g>

  <!-- 亮度卡 -->
  <g>
    <rect x="280" y="92" width="200" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="380" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">亮度（部分型号）</text>
    <rect x="300" y="132" width="160" height="8" rx="4" fill="#e6e8eb"/>
    <rect x="300" y="132" width="100" height="8" rx="4" fill="#0969da"/>
    <circle cx="400" cy="136" r="10" fill="#0969da"/>
    <text x="380" y="166" text-anchor="middle" font-size="11" fill="#57606a">拖动滑条调光</text>
  </g>

  <!-- 环境光/电流卡 -->
  <g>
    <rect x="500" y="92" width="200" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="600" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">环境光 / 电流</text>
    <text x="600" y="142" text-anchor="middle" font-size="12" fill="#0969da">环境亮度 65%</text>
    <text x="600" y="164" text-anchor="middle" font-size="12" fill="#0969da">电流 0.42 A</text>
  </g>

  <!-- 定时卡 -->
  <g>
    <rect x="60" y="196" width="320" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="220" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">定时（按真实时间）</text>
    <text x="130" y="248" text-anchor="middle" font-size="12" fill="#0969da">开灯 07:00</text>
    <text x="310" y="248" text-anchor="middle" font-size="12" fill="#0969da">关灯 23:00</text>
    <text x="220" y="270" text-anchor="middle" font-size="11" fill="#57606a">每天自动执行 · 支持跨夜</text>
  </g>

  <!-- 其他卡 -->
  <g>
    <rect x="400" y="196" width="300" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="550" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">网络 / 升级 / 诊断</text>
    <text x="550" y="248" text-anchor="middle" font-size="12" fill="#57606a">更换 Wi-Fi · OTA 升级</text>
    <text x="550" y="268" text-anchor="middle" font-size="11" fill="#8c959f">数据每 2 秒自动刷新</text>
  </g>

  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#8c959f">不同板型功能略有差异，不支持的选项网页会自动隐藏</text>
</svg>
