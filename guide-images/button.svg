<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="320" rx="14" fill="#f6f8fa"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">本地按键：短按开关 · 长按恢复出厂</text>

  <!-- 设备图 -->
  <g transform="translate(280,90)">
    <rect x="0" y="0" width="200" height="180" rx="16" fill="#fff" stroke="#d0d7de"/>
    <rect x="40" y="40" width="120" height="120" rx="60" fill="#e6f4ea" stroke="#1a7f37"/>
    <text x="100" y="105" text-anchor="middle" font-size="40">☀</text>
    <text x="100" y="143" text-anchor="middle" font-size="12" fill="#1a7f37">按键</text>
    <text x="100" y="172" text-anchor="middle" font-size="11" fill="#8c959f">（设备面板）</text>
  </g>

  <!-- 短按 -->
  <g>
    <rect x="30" y="80" width="220" height="150" rx="12" fill="#f0f6ff" stroke="#0969da"/>
    <text x="140" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#0969da">短按（一下）</text>
    <path d="M95 135 q18 -20 36 0 q18 20 36 0" fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
    <text x="140" y="170" text-anchor="middle" font-size="13" fill="#24292f">开灯 / 关灯</text>
    <text x="140" y="196" text-anchor="middle" font-size="11.5" fill="#57606a">日常最常用，不用开手机</text>
    <text x="140" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">轻触一下即可</text>
  </g>

  <!-- 长按 -->
  <g>
    <rect x="510" y="80" width="220" height="150" rx="12" fill="#fffbe9" stroke="#9a6700"/>
    <text x="620" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6700">长按约 3 秒</text>
    <g transform="translate(620,140)">
      <circle r="24" fill="#fff" stroke="#9a6700"/>
      <path d="M0 -13 V0 L8 6" fill="none" stroke="#9a6700" stroke-width="3" stroke-linecap="round"/>
      <text x="34" y="6" font-size="12" fill="#24292f">3 秒</text>
    </g>
    <text x="620" y="190" text-anchor="middle" font-size="13" fill="#24292f">恢复出厂设置</text>
    <text x="620" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">清空 Wi-Fi / 定时 / 灯光设置</text>
  </g>

  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#8c959f">注意：长按恢复出厂会清除全部设置，设备回到配网热点模式，需要重新配网</text>
</svg>
