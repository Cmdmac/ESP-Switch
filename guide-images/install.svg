<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="330" rx="14" fill="#f6f8fa"/>
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">USB 通断器连接：适配器 → 通断器 → USB 用电设备</text>

  <!-- ① 电源适配器 -->
  <g>
    <rect x="30" y="90" width="180" height="150" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="120" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">① 电源适配器</text>
    <!-- 插头 -->
    <rect x="52" y="128" width="36" height="22" rx="4" fill="#d0d7de"/>
    <rect x="58" y="150" width="8" height="16" rx="2" fill="#8c959f"/>
    <rect x="74" y="150" width="8" height="16" rx="2" fill="#8c959f"/>
    <!-- 充电器本体 -->
    <rect x="96" y="122" width="52" height="52" rx="10" fill="#f0f2f5" stroke="#8c959f"/>
    <text x="122" y="152" text-anchor="middle" font-size="12" fill="#57606a">5V</text>
    <!-- USB 输出口 -->
    <rect x="150" y="140" width="18" height="16" rx="3" fill="#57606a"/>
    <text x="120" y="215" text-anchor="middle" font-size="11" fill="#57606a">充电器 / 充电宝</text>
    <text x="120" y="231" text-anchor="middle" font-size="11" fill="#8c959f">USB 口供电</text>
  </g>

  <!-- 箭头：适配器 → 通断器输入 -->
  <path d="M215 165 H255" stroke="#0969da" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="235" y="152" text-anchor="middle" font-size="11" fill="#0969da">USB 线</text>

  <!-- ② USB 通断器 -->
  <g>
    <rect x="265" y="90" width="200" height="150" rx="12" fill="#e6f4ea" stroke="#1a7f37"/>
    <text x="365" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">② USB 通断器（本设备）</text>
    <rect x="365" y="130" width="46" height="22" rx="4" fill="#fff" stroke="#1a7f37"/>
    <text x="388" y="146" text-anchor="middle" font-size="11" fill="#1a7f37">USB 输入</text>
    <rect x="365" y="164" width="46" height="22" rx="4" fill="#fff" stroke="#1a7f37"/>
    <text x="388" y="180" text-anchor="middle" font-size="11" fill="#1a7f37">USB 输出</text>
    <text x="365" y="210" text-anchor="middle" font-size="11" fill="#57606a">ESPSwitch-XXXX</text>
    <text x="365" y="226" text-anchor="middle" font-size="11" fill="#57606a">Wi-Fi 智能控制</text>
  </g>

  <!-- 箭头：通断器输出 → 设备 -->
  <path d="M470 165 H510" stroke="#0969da" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#0969da">USB 线</text>

  <!-- ③ USB 用电设备 -->
  <g>
    <rect x="520" y="90" width="210" height="150" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="625" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">③ USB 用电设备</text>
    <!-- 灯带示意 -->
    <g transform="translate(560,130)">
      <rect x="0" y="0" width="130" height="44" rx="8" fill="#fffbe9" stroke="#9a6700"/>
      <circle cx="18" cy="22" r="9" fill="#f6c344"/>
      <circle cx="44" cy="22" r="9" fill="#f6c344"/>
      <circle cx="70" cy="22" r="9" fill="#f6c344"/>
      <circle cx="96" cy="22" r="9" fill="#f6c344"/>
      <circle cx="118" cy="22" r="9" fill="#f6c344"/>
    </g>
    <text x="625" y="200" text-anchor="middle" font-size="11" fill="#57606a">USB 灯带 / 风扇等</text>
    <text x="625" y="216" text-anchor="middle" font-size="11" fill="#8c959f">插在通断器的输出口</text>
  </g>

  <!-- 底部提示 -->
  <g>
    <rect x="30" y="262" width="700" height="46" rx="10" fill="#f0f6ff" stroke="#0969da"/>
    <text x="380" y="282" text-anchor="middle" font-size="13" fill="#0969da">即插即用，无需改动任何市电线路</text>
    <text x="380" y="300" text-anchor="middle" font-size="12" fill="#57606a">拔掉 USB 供电即完全断电；请勿超过设备额定负载</text>
  </g>

  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0969da"/></marker></defs>
</svg>
