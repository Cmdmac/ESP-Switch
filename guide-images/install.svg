<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="320" rx="14" fill="#f6f8fa"/>
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">① 断电 → ② 接线 → ③ 送电</text>

  <!-- ① 空开断电 -->
  <g>
    <rect x="30" y="80" width="200" height="150" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="130" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#cf222e">① 安装前断电</text>
    <rect x="90" y="125" width="80" height="52" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <rect x="118" y="132" width="24" height="14" rx="3" fill="#cf222e"/>
    <rect x="122" y="150" width="16" height="16" rx="3" fill="#cf222e"/>
    <text x="130" y="200" text-anchor="middle" font-size="13" fill="#57606a">关闭对应空开/保险</text>
  </g>

  <!-- 箭头 -->
  <path d="M245 155 H295" stroke="#6e7781" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <!-- ② 接线 -->
  <g>
    <rect x="305" y="80" width="200" height="150" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="405" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">② 串接火线回路</text>
    <!-- 开关盒 -->
    <rect x="345" y="130" width="120" height="64" rx="10" fill="#e6f4ea" stroke="#1a7f37"/>
    <text x="405" y="158" text-anchor="middle" font-size="13" fill="#1a7f37">智能开关</text>
    <text x="405" y="180" text-anchor="middle" font-size="12" fill="#57606a">L 进 / L 出 接灯具</text>
    <!-- 电线示意 -->
    <line x1="320" y1="150" x2="345" y2="150" stroke="#57606a" stroke-width="4"/>
    <line x1="465" y1="150" x2="500" y2="150" stroke="#57606a" stroke-width="4"/>
    <circle cx="505" cy="150" r="14" fill="#fffbe9" stroke="#9a6700"/><text x="505" y="155" text-anchor="middle" font-size="11" fill="#9a6700">灯</text>
  </g>

  <!-- 箭头 -->
  <path d="M520 155 H570" stroke="#6e7781" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <!-- ③ 送电 -->
  <g>
    <rect x="580" y="80" width="150" height="150" rx="12" fill="#fff" stroke="#d0d7de"/>
    <text x="655" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">③ 恢复供电</text>
    <circle cx="655" cy="160" r="30" fill="#e6f4ea" stroke="#1a7f37"/>
    <text x="655" y="167" text-anchor="middle" font-size="22">✓</text>
    <text x="655" y="215" text-anchor="middle" font-size="12" fill="#57606a">约 10 秒启动完成</text>
  </g>

  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#8c959f">注意：接线务必在断电状态下进行，确认无误后再送电</text>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6e7781"/></marker></defs>
</svg>
