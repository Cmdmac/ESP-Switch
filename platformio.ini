; PlatformIO 工程配置 —— 用于编译 ESP-Switch 各产品板
; 用法：
;   pio run -e esp32c3-switch           # 仅编译
;   pio run -e esp32c3-switch -t upload   # 编译并上传（需接好板子）
;   pio run -e esp32c3-switch -t monitor  # 监视串口
;
; 说明：
; - 同一份 ESP32_Light_Switch.ino，通过 build_flags 的 -DBOARD_XXX 选择引脚/功能，
;   与网页控制台(arduino-cli-web)里的“产品板型”下拉一一对应。
; - C3 / ESP8285 / ESP8266 可用本 PIO 配置（esp32c3 用 espressif32，8285/8266 用 espressif8266）。
; - ESP32-C2 不能走 PIO/arduino-cli（3.x 缺 esp32c2-libs）—— 请用 ESP-IDF 工程
;   idf-c2/（arduino-esp32 作组件，IDF 5.3.x），或网页控制台 Tab2。详见 README / DEPLOY.md。
; - src_dir 指向 .ino 所在目录，PIO 会把 .ino 当工程源码编译。

[platformio]
src_dir = ESP32_Light_Switch
default_envs = esp32c3-switch

; ===================== ESP32-C2 =====================
; ⚠️ 不能在此编译！C2 请用 idf-c2 工程（arduino 作 ESP-IDF 组件）：
;   cd idf-c2 && . <IDF>/export.sh && IDF_C2_BOARD=BOARD_ESP32C2_SWITCH_NANO \
;     idf.py -B build/BOARD_ESP32C2_SWITCH_NANO build
; 或网页控制台 Tab2。详见 README / DEPLOY.md。

; ===================== ESP32-C3 =====================
[env:esp32c3-switch]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -DBOARD_ESP32C3_SWITCH
monitor_speed = 115200

[env:esp32c3-module]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -DBOARD_ESPC3_MODULE
monitor_speed = 115200

; ===================== ESP8266 / ESP8285 =====================
[env:esp01f-switch]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = -DBOARD_ESP01F_SWITCH
monitor_speed = 115200

[env:esp8285-switch]
platform = espressif8266
board = esp8285
framework = arduino
build_flags = -DBOARD_ESP8285_SWITCH
monitor_speed = 115200

[env:esp8285-module]
platform = espressif8266
board = esp8285
framework = arduino
build_flags = -DBOARD_ESP8285_MODULE
monitor_speed = 115200
